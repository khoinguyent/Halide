version: '3.8'

services:
  backend:
    build: .
    restart: always
    # ports:
    #   - "8000:8000"  # Now handled by Caddy
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

  backend-staging:
    build: .
    restart: always
    env_file:
      - .env.staging
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: halide_user
      POSTGRES_PASSWORD: halide_password
      POSTGRES_DB: halide
    # Loopback only on the host — connect from your laptop with: ssh -L 5433:127.0.0.1:15432 ...
    # Do not publish 0.0.0.0:5432; that exposes the DB to the whole internet.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
